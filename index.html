<!DOCTYPE html>
<html lang="en">
<head>
	<title>Kanban Board</title>
</head>

<body>
	<header>
		<h1>Kanban Board</h1>
		<h2>Tasks: <span id="task-counter">0</span></h2>

		<select>
			<option value="All">All</option>
			<option value="High">High</option>
			<option value="Medium">Medium</option>
			<option value="Low">Low</option>	
		</select> 
	</header>

	<main class="board">
		<section id="todo" class="column">
			<h2>To Do</h2>
			<ul class="task-list"></ul>
			<button class="add-task-btn">Add Task</button>
		</section>
		
		<section id="inprogress" class="column">
			<h2>In Progress</h2>
			<ul class="task-list"></ul>
			<button class="add-task-btn">Add Task</button>
		</section>

		<section id="done" class="column">
			<h2>Done</h2>
			<ul class="task-list"></ul>
			<button class="add-task-btn">Add Task</button>
		</section>
	</main>

	<div id="task-modal" class="modal">
		<div class="modal-content">
			<h3>Add New Task</h3>
		<input type="text" id="task-title" placeholder="Task Title">
		<textarea id=task-desc placeholder="Task Description"></textarea>

		<label>Priority: </label>
		<select id="task-priority">
			<option value="High">High</option>
			<option value="Medium">Medium</option>
			<option value="Low">Low</option>	
		</select>

		<label>Due Date: </label>
		<input type="date" id="task-date">

		<div class="add-task-actions">
			<button id="save-task">Save</button>
			<button id="cancel-task">Cancel</button>
		</div>
	</div>



</body>
</html>
